# Standalone dependency set for running this suite on its own — e.g. from another
# project's CI or a user's machine — without flyte-sdk's full dev environment.
# Inside flyte-sdk the repo's own dev group already provides these; this file is the
# "point it at my backend and run it" convenience.
#
# `flyte` and `flyteplugins-union` are temporarily pinned to a known-good pair.
# flyteplugins-union (used by a consumer's cluster-ops driver — see below) renamed
# Cluster.pools -> Cluster.pool in 0.7.0, so an unpinned `--upgrade` silently
# breaks callers that read the attribute; the pins make the env deterministic.
# Unpin once the consuming CI tracks a stable SDK line again — validate against a
# current SDK where you can, and pin `flyte` down further only if your backend is a
# release behind and rejects a newer field. Not a distributable package.
[project]
name = "flyte-functional-tests"
version = "0"
description = "Environment-validation smoke suite for a Flyte v2 backend (see README.md)."
requires-python = ">=3.10"
dependencies = [
    "flyte==2.5.20",
    # Not imported by the suite itself; declared here so a consumer that drives the
    # cluster (pool/queue/routing ops) from this same env gets a pinned, known API.
    "flyteplugins-union==0.7.0",
    "fastapi",
    "uvicorn",
    "httpx",
    "pytest>=8.3.5",
    "pytest-xdist",
    "pytest-rerunfailures",
]

[tool.uv]
package = false
