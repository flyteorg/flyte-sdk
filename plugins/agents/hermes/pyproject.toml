[project]
name = "flyteplugins-agents-hermes"
dynamic = ["version"]
description = "Run Hermes agent on Flyte."
readme = "README.md"
authors = [{ name = "Niels Bantilan", email = "niels@union.ai" }]
# hermes-agent gates every one of its dependencies on Python >= 3.14, so an
# install on an older Python imports nothing.
requires-python = ">=3.14"
# hermes-agent is not a declared dependency. Upstream stopped publishing to
# PyPI after 0.19.0, and a bare requirement would resolve to that release,
# which has open advisories (CVE-2026-10221, CVE-2026-10224). Install it from
# git instead; see the module docstring of flyteplugins.agents.hermes.
dependencies = [
    "flyteplugins-agents-core",
]

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "hermes-agent",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["flyteplugins*"]

[tool.setuptools_scm]
root = "../../.."

[tool.pytest.ini_options]
norecursedirs = []
log_cli = true
log_cli_level = 20
markers = []
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
# Repo tooling such as the docstring checker parses every file with an older
# Python than this plugin requires, so keep the syntax 3.11-compatible.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PLW", "YTT", "ASYNC", "C4", "T10", "EXE", "ISC", "LOG", "PIE", "Q", "RSE", "FLY", "PGH", "PLC", "PLE", "PLW", "FURB", "RUF"]
ignore = ["PGH003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.uv]
# hermes-agent's setup.py refuses to build a wheel unless this is set, since
# upstream only builds wheels inside Nix. The wheel leaves out bundled assets
# (locales, skills, optional MCP servers); the plugin tests pass without them.
extra-build-variables = { hermes-agent = { HERMES_NIX_BUILD = "1" } }
override-dependencies = [
    "pillow>=13.0.0",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.0",
    "certifi>=2026.10.18",
]

[tool.uv.sources]
flyte = { path = "../../..", editable = true }
flyteplugins-agents-core = { path = "../core", editable = true }
hermes-agent = { git = "https://github.com/NousResearch/hermes-agent", tag = "v0.23.4" }
