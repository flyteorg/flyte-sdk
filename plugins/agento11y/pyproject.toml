[project]
name = "flyteplugins-agento11y"
dynamic = ["version"]
description = "Grafana Agent Observability (agento11y) for Flyte agents"
readme = "README.md"
authors = [{ name = "Samhita Alla", email = "samhita@union.ai" }]
requires-python = ">=3.10"
dependencies = [
    "agento11y>=0.12.0",
    "flyteplugins-agents-core",
    "flyteplugins-otel",
    "flyte"
]

# One extra per framework, matching the adapter it instruments. Installing an extra is what
# makes that framework's instrumentor available; nothing else has to be configured.
[project.optional-dependencies]
langchain = ["agento11y-langchain"]
langgraph = ["agento11y-langgraph"]
openai = ["agento11y-openai-agents"]
claude = ["agento11y-claude-agent-sdk"]
google = ["agento11y-google-adk"]
pydantic-ai = ["agento11y-pydantic-ai"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["flyteplugins*"]

[tool.setuptools_scm]
root = "../../"

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = []
log_cli = true
log_cli_level = 20
markers = []
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PLW", "YTT", "ASYNC", "C4", "T10", "EXE", "ISC", "LOG", "PIE", "Q", "RSE", "FLY", "PGH", "PLC", "PLE", "PLW", "FURB", "RUF"]
ignore = ["PGH003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]

[tool.uv.sources]
flyte = { path = "../../", editable = true }
flyteplugins-otel = { path = "../otel", editable = true }
flyteplugins-agents-core = { path = "../agents/core", editable = true }
